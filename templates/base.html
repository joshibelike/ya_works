<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
        }
        .header-title {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row align-items-center mb-4">
            <div class="col-md-8">
                <h1 class="header-title">Миссия Колонизация Марса</h1>
            </div>
            <div class="col-md-4 text-end">
                <h4>Mars One</h4>
            </div>
        </div>

        <div class="text-secondary fs-4 mb-4" style="font-style: italic;">
            И на Марсе будут яблони цвести!
        </div>

        <div class="content-block">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
