{% extends "base.html" %}

{% block content %}
    <h2>{{ title }}</h2>

    <div class="mt-4">
        <p class="fs-5">Специальность: <span class="badge bg-info text-dark">{{ prof }}</span></p>
    </div>

    <div class="text-center mt-4">
        <img src="{{ url_for('static', filename='img/' + image) }}"
             class="img-fluid"
             alt="Схема расположения"
             style="max-height: 500px; border-radius: 10px; box-shadow: 0 0 30px rgba(0,0,0,0.5);">
    </div>

    <div class="mt-4 text-center">
        <a href="/" class="btn btn-outline-light">Вернуться на главную</a>
    </div>
{% endblock %}
