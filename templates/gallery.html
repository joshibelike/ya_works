{% extends "base.html" %}

{% block content %}
    <h2 class="text-center mb-4">Галерея марсианских пейзажей</h2>

    <div class="card mb-4" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);">
        <div class="card-body">
            <h5 class="card-title">Загрузить новый пейзаж</h5>
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <input type="file" name="file" class="form-control" accept="image/*" required>
                </div>
                <button type="submit" class="btn btn-primary">Загрузить</button>
            </form>
        </div>
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for image in images %}
            <div class="col">
                <div class="card h-100" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);">
                    <img src="{{ url_for('static', filename='img/' + image) }}"
                         class="card-img-top"
                         alt="{{ image }}"
                         style="height: 200px; object-fit: cover;">
                    <div class="card-body">
                        <p class="card-text text-center text-light">{{ image }}</p>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>

    {% if not images %}
        <div class="alert alert-info text-center">
            В галерее пока нет изображений. Загрузите первый пейзаж!
        </div>
    {% endif %}

    <div class="mt-4 text-center">
        <a href="/" class="btn btn-outline-light">Вернуться на главную</a>
    </div>
{% endblock %}
